name: CD

# Deploy automatizado do OS Service (ADR-042). A cada push na main: o mesmo CI
# e a mesma varredura de seguranca do PR (workflows reutilizaveis), a imagem
# construida uma vez e publicada no GHCR com o SHA do commit como tag, o deploy
# num kind efemero dentro do runner com a plataforma e os tres servicos,
# validado pelo smoke de cada namespace e pelo E2E BDD da saga. O kind do
# runner e o ambiente Kubernetes do deploy automatizado; o deploy remoto, num
# cluster persistente, e opcional e vem desligado. README, secao "CD".
on:
  push:
    branches: [main]
  # Reexecuta uma combinacao de commits. O OS Service e sempre o commit do run:
  # sha_os_service so aceita esse valor e existe para os quatro workflows de CD
  # terem as mesmas entradas.
  workflow_dispatch:
    inputs:
      sha_platform:
        description: "Commit do platform (40 hexadecimais minusculos); vazio usa o do ultimo CD verde"
        required: false
        type: string
      sha_os_service:
        description: "Vazio ou o commit deste run"
        required: false
        type: string
      sha_billing_service:
        description: "Commit do Billing Service (40 hexadecimais minusculos); vazio usa o do ultimo CD verde"
        required: false
        type: string
      sha_execution_service:
        description: "Commit do Execution Service (40 hexadecimais minusculos); vazio usa o do ultimo CD verde"
        required: false
        type: string

permissions:
  contents: read

# Um CD por vez no repositorio, sem cancelar o que esta em curso: dois pushes
# seguidos nao implantam fora de ordem. O GitHub guarda um unico run pendente
# por grupo, entao o push seguinte substitui o pendente e aquele commit fica
# sem CD; o run que sobra testa o estado mais novo da main.
concurrency:
  group: cd-${{ github.repository }}
  cancel-in-progress: false

env:
  SERVICO: os-service

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security-scan:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  # Constroi a imagem uma vez. O deploy-kind carrega o tar daqui (a imagem que
  # o E2E testa e a que foi para o GHCR), e o deploy-remoto, se ligado, implanta o
  # mesmo digest.
  image:
    needs: [ci, security-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      imagem: ${{ steps.meta.outputs.imagem }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: meta
        name: Referencia da imagem e data do commit
        env:
          DONO: ${{ github.repository_owner }}
        run: |
          {
            echo "imagem=ghcr.io/${DONO,,}/pytstop-${SERVICO}:${GITHUB_SHA}"
            echo "data=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # SBOM em SPDX e proveniencia ficam no indice da imagem no registry. O
      # cache de camadas e o do BuildKit no cache do GitHub, por servico.
      - id: build
        name: Build e push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.imagem }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_DATE=${{ steps.meta.outputs.data }}
          cache-from: type=gha,scope=${{ env.SERVICO }}
          cache-to: type=gha,mode=max,scope=${{ env.SERVICO }}
      # So a plataforma linux/amd64, sem os manifestos de atestado do indice:
      # com eles o kind load falha por digest ausente no image store do
      # containerd. O docker pull imprime o digest do indice, que tem de ser o
      # que o build publicou.
      - name: Confere o digest publicado e salva o tar da imagem
        env:
          IMAGEM: ${{ steps.meta.outputs.imagem }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -o pipefail
          docker pull --platform linux/amd64 "$IMAGEM" | tee pull.log
          grep -qxF "Digest: $DIGEST" pull.log \
            || { echo "::error::the digest pulled for $IMAGEM is not the one that was pushed"; exit 1; }
          docker save --platform linux/amd64 -o imagem.tar "$IMAGEM"
      - name: SBOM da imagem publicada e resumo
        env:
          IMAGEM: ${{ steps.meta.outputs.imagem }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGEM" --format '{{ json .SBOM }}' > "sbom-${SERVICO}.spdx.json"
          pacotes=$(jq '[.. | objects | select(has("packages")) | .packages | length] | add // 0' "sbom-${SERVICO}.spdx.json")
          [ "$pacotes" -gt 0 ] || { echo "::error::the SBOM of $IMAGEM lists no package"; exit 1; }
          echo "image $IMAGEM digest $DIGEST, SBOM with $pacotes packages"
          {
            echo "### Image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Reference | \`$IMAGEM\` |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| SBOM (SPDX) | $pacotes packages, artifact \`sbom-${SERVICO}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: imagem
          path: imagem.tar
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ env.SERVICO }}
          path: sbom-${{ env.SERVICO }}.spdx.json
          retention-days: 90

  # O deploy obrigatorio: a plataforma e os tres servicos num kind do runner. O
  # proprio servico entra pela imagem do job image; o platform e os dois
  # vizinhos, construidos do codigo, nos commits do ultimo CD verde de cada um.
  deploy-kind:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      sha_platform: ${{ steps.shas.outputs.sha_platform }}
    steps:
      # Os quatro inputs do dispatch entram so por env e sao validados antes de
      # qualquer checkout. Sem input, o commit do ultimo run verde do cd.yml do
      # repositorio na main (push); sem run verde ainda (o cd.yml novo, ou o
      # repositorio sem ele: 404), a main HEAD, com aviso. Qualquer outra falha
      # da API reprova o passo, em vez de cair na main calado.
      - id: shas
        name: Commits do platform e dos vizinhos
        env:
          GH_TOKEN: ${{ github.token }}
          DONO: ${{ github.repository_owner }}
          SHA_PROPRIO: ${{ github.sha }}
          SHA_PLATFORM: ${{ inputs.sha_platform }}
          SHA_OS_SERVICE: ${{ inputs.sha_os_service }}
          SHA_BILLING_SERVICE: ${{ inputs.sha_billing_service }}
          SHA_EXECUTION_SERVICE: ${{ inputs.sha_execution_service }}
        run: |
          set -euo pipefail
          padrao='^[0-9a-f]{40}$'
          for nome in SHA_PLATFORM SHA_OS_SERVICE SHA_BILLING_SERVICE SHA_EXECUTION_SERVICE; do
            valor=${!nome}
            if [ -n "$valor" ] && ! [[ "$valor" =~ $padrao ]]; then
              echo "::error::input $(tr '[:upper:]' '[:lower:]' <<< "$nome") must be 40 lowercase hexadecimal characters"
              exit 1
            fi
          done
          if [ -n "$SHA_OS_SERVICE" ] && [ "$SHA_OS_SERVICE" != "$SHA_PROPRIO" ]; then
            echo "::error::input sha_os_service must be empty or the commit of this run: the image of this service is built from the commit that started the workflow"
            exit 1
          fi
          erro=$(mktemp)
          ultimo_verde() {
            local resposta
            if ! resposta=$(gh api -X GET "repos/$DONO/$1/actions/workflows/cd.yml/runs" \
              -f branch=main -f event=push -f status=success -f per_page=1 \
              --jq '.workflow_runs[0].head_sha // empty' 2> "$erro"); then
              grep -q 'HTTP 404' "$erro" || { cat "$erro" >&2; return 1; }
              resposta=""
            fi
            echo "$resposta"
          }
          # resolver <nome> <input do dispatch>: grava sha_<nome> e origem_<nome>.
          resolver() {
            local repo sha origem
            repo=postech-sw-arch-p4-${1//_/-}
            if [ -n "$2" ]; then
              sha=$2
              origem="dispatch input"
            else
              sha=$(ultimo_verde "$repo")
              origem="last green CD"
              if [ -z "$sha" ]; then
                sha=$(gh api "repos/$DONO/$repo/commits/main" --jq .sha)
                origem="main HEAD, no green CD yet"
                if [[ "$sha" =~ $padrao ]]; then
                  echo "::warning::$repo has no green CD run on main yet: using main HEAD $sha"
                fi
              fi
            fi
            [[ "$sha" =~ $padrao ]] || { echo "::error::could not resolve a commit for $repo"; exit 1; }
            printf -v "sha_$1" %s "$sha"
            printf -v "origem_$1" %s "$origem"
          }
          resolver platform "$SHA_PLATFORM"
          resolver billing_service "$SHA_BILLING_SERVICE"
          resolver execution_service "$SHA_EXECUTION_SERVICE"
          sha_os_service=$SHA_PROPRIO
          origem_os_service="this run"
          {
            echo "sha_platform=$sha_platform"
            echo "sha_os_service=$sha_os_service"
            echo "sha_billing_service=$sha_billing_service"
            echo "sha_execution_service=$sha_execution_service"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Commits used by the kind deploy"
            echo
            echo "| Repository | Commit | Origin |"
            echo "|---|---|---|"
            echo "| postech-sw-arch-p4-platform | \`$sha_platform\` | $origem_platform |"
            echo "| postech-sw-arch-p4-os-service | \`$sha_os_service\` | $origem_os_service |"
            echo "| postech-sw-arch-p4-billing-service | \`$sha_billing_service\` | $origem_billing_service |"
            echo "| postech-sw-arch-p4-execution-service | \`$sha_execution_service\` | $origem_execution_service |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/postech-sw-arch-p4-platform
          ref: ${{ steps.shas.outputs.sha_platform }}
          path: platform
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.shas.outputs.sha_os_service }}
          path: os-service
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/postech-sw-arch-p4-billing-service
          ref: ${{ steps.shas.outputs.sha_billing_service }}
          path: billing-service
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/postech-sw-arch-p4-execution-service
          ref: ${{ steps.shas.outputs.sha_execution_service }}
          path: execution-service
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: imagem
      # uv no runner para o make e2e do platform: o Python vem do
      # .python-version dele e as dependencias, do uv.lock.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      # kind e kubectl fixados, make kind-up e make deploy no overlay kind-ci,
      # que tambem gera os Secrets dos servicos. As etapas sao medidas pelo
      # medir-kind.sh e o resumo sai num passo proprio, mesmo com falha.
      - name: Plataforma no kind (overlay kind-ci)
        run: platform/scripts/ci/deploy-kind.sh
      - name: Servicos no kind (imagem deste job image, vizinhos construidos do codigo)
        env:
          IMAGEM: ${{ needs.image.outputs.imagem }}
        run: |
          platform/scripts/medir-kind.sh etapa servicos
          platform/scripts/ci/implantar-servicos.sh --overlay kind-ci \
            --tar "os-service=imagem.tar" --imagem "os-service=$IMAGEM" \
            os-service=os-service billing-service=billing-service execution-service=execution-service
      - name: Smoke por namespace
        run: |
          platform/scripts/medir-kind.sh etapa smoke
          platform/scripts/ci/smoke-servicos.sh
      - name: E2E BDD da saga (make e2e)
        run: |
          platform/scripts/medir-kind.sh etapa e2e
          make -C platform e2e
      - name: Minutos e memoria no summary
        if: always()
        run: platform/scripts/medir-kind.sh resumo
      - name: Publica os relatorios do E2E
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-kind
          path: platform/reports/
          retention-days: 90
      # Tambem no cancelamento, inclusive o do timeout-minutes.
      - name: Pods, eventos e logs (diagnostico)
        if: failure() || cancelled()
        run: platform/scripts/ci/diagnostico.sh

  # Opcional e desligado: o ambiente do deploy automatizado e o kind do runner.
  # Com a variavel DEPLOY_REMOTO_HABILITADO igual a true, o mesmo digest que
  # passou no kind vai para um cluster persistente que o dono do repositorio
  # configura (README, secao "CD"). O script e o overlay vem do platform, no
  # commit usado no kind. Nenhuma credencial de provedor mora neste arquivo.
  deploy-remoto:
    needs: [image, deploy-kind]
    if: vars.DEPLOY_REMOTO_HABILITADO == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/postech-sw-arch-p4-platform
          ref: ${{ needs.deploy-kind.outputs.sha_platform }}
          path: platform
          persist-credentials: false
      # O acesso ao cluster entra aqui, antes do deploy: gravar o kubeconfig do
      # segredo KUBECONFIG_REMOTO num arquivo e exportar KUBECONFIG, ou usar a
      # action de login do provedor. Sem isso o script nao enxerga o contexto.
      - name: Acesso ao cluster remoto (a configurar)
        run: echo "::notice::remote cluster access is not configured in this step, add the kubeconfig (secret KUBECONFIG_REMOTO) or the provider login before the deploy"
      - name: Deploy no cluster remoto (mesmo digest do kind)
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXTO: ${{ vars.DEPLOY_REMOTO_CONTEXTO }}
          OVERLAY: ${{ vars.DEPLOY_REMOTO_OVERLAY || 'k3s' }}
          IMAGEM: ${{ needs.image.outputs.imagem }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          [ -x platform/scripts/ci/deploy-remoto.sh ] \
            || { echo "::error::platform/scripts/ci/deploy-remoto.sh does not exist in the platform commit used by this run: keep DEPLOY_REMOTO_HABILITADO off until it is merged"; exit 1; }
          platform/scripts/ci/deploy-remoto.sh --contexto "$CONTEXTO" --overlay "$OVERLAY" \
            --servico "$SERVICO" --imagem "${IMAGEM}@${DIGEST}"

  remoto-skipped:
    needs: deploy-kind
    if: vars.DEPLOY_REMOTO_HABILITADO != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo "::notice::deploy remoto desligado (DEPLOY_REMOTO_HABILITADO); o deploy validado desta execucao e o do kind"
