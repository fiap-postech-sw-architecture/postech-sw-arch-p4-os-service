name: Security

# pip-audit (CVE nas dependencias de runtime), gitleaks (segredos no historico) e
# trivy (CVE na imagem). Bandit fica no ci.yml. Roda em todo PR, na main
# chamado pelo cd.yml antes da imagem (ADR-042) e toda segunda-feira, para
# pegar CVE nova sem depender de push.
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1"

permissions:
  contents: read

concurrency:
  group: "security-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # Dependencias de runtime com os extras que a imagem instala; ferramentas de teste ficam fora.
      - name: Exporta o lockfile de producao
        run: >-
          uv export --frozen --no-emit-project --no-dev --all-extras --no-hashes
          --format requirements-txt -o requirements-prod.txt
      # O resultado tambem vai para o summary do job (registra-no-summary.sh).
      - name: pip-audit
        run: >-
          scripts/ci/registra-no-summary.sh "pip-audit (dependencias de runtime)"
          uvx pip-audit==2.10.1 -r requirements-prod.txt --strict --progress-spinner off

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Historico inteiro do commit testado (no PR, o merge do PR na main):
      # segredo commitado e apagado num commit seguinte tambem reprova. Sem
      # --log-opts o gitleaks usa `git log --all` e varreria as branches dos
      # outros PRs abertos.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # Binario direto: o gitleaks-action exige licenca em repositorio de organizacao.
      - name: Instala gitleaks (versao e sha256 fixados)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: gitleaks (historico do HEAD)
        run: gitleaks git . --log-opts="HEAD" --config .gitleaks.toml --redact --no-banner --verbose
      - name: Regras do .gitleaks.toml reprovam senha em URL num manifesto e no historico (teste negativo)
        run: scripts/ci/testa-gitleaks.sh

  trivy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Onde baixar o banco de vulnerabilidades, em ordem de preferencia. O
      # trivy passa ao registro seguinte quando um responde erro temporario
      # (429 TOOMANYREQUESTS, 5xx); com um so (o public.ecr.aws), o limite de
      # pull anonimo derruba o job de vez em quando. Erro de rede (DNS,
      # conexao) nao passa ao seguinte. Vale tambem para o relatorio das imagens
      # de terceiros. Sem espaco depois das virgulas.
      TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build da imagem de runtime
        run: docker build -t "${GITHUB_REPOSITORY#*/}:scan-${GITHUB_SHA}" .
      # A versao e a do Makefile (TRIVY_VERSION), a mesma do make manifests.
      - name: Instala trivy
        run: |
          versao="$(make -s print-trivy-version)"
          curl -sSfL "https://raw.githubusercontent.com/aquasecurity/trivy/v${versao}/contrib/install.sh" \
            | sh -s -- -b /usr/local/bin "v${versao}"
      - name: trivy (HIGH e CRITICAL com correcao disponivel)
        run: >-
          scripts/ci/registra-no-summary.sh "trivy da imagem do servico (HIGH e CRITICAL com correcao)"
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --no-progress
          --exit-code 1 "${GITHUB_REPOSITORY#*/}:scan-${GITHUB_SHA}"
      # As imagens de terceiros dos manifestos (o PostgreSQL e o exporter): so o
      # relatorio no summary, sem reprovar o job, porque a correcao depende de
      # um build novo do fornecedor. Nem o achado nem a falha da varredura (pull
      # recusado, tag removida, banco do trivy fora) reprovam: a falha vira
      # aviso no summary (scripts/ci/relatorio-trivy-terceiros.sh, com teste em
      # tests/unitarios/test_scripts_ci.py). O risco aceito e a politica de subir
      # a versao estao em docs/como-rodar.md, em Implantacao.
      - name: trivy das imagens de terceiros dos manifestos (relatorio)
        run: scripts/ci/relatorio-trivy-terceiros.sh
