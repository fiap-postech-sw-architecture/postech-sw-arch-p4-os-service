# Lido pelo sonar-scanner em scripts/sonar/analisar.sh (a chave do projeto vem do script).
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
# Migracoes geradas e configuracao nao entram na medicao de duplicacao.
sonar.cpd.exclusions=migrations/**
