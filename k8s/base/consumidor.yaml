# Consumidor da fila os.eventos (python -m src.consumidor), na mesma imagem da
# API, com a saude por arquivo em /tmp como o relay (relay.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service-consumidor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: os-service-consumidor
  template:
    metadata:
      labels:
        app: os-service-consumidor
        processo: consumidor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      # Cobre a mensagem em curso: o SIGTERM a conclui antes de fechar.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # O mesmo da API (api.yaml): espera a migracao desta versao.
        - name: aguarda-migracao
          image: pytstop-os-service
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              while :; do
                saida=$(alembic current 2>&1)
                printf '%s\n' "$saida" | grep -q -e '(head)' -e "Can't locate revision" && break
                motivo=$(printf '%s\n' "$saida" | grep -E -e 'Error: ' -e '^[0-9a-z_]+$' | tail -n 1)
                echo "waiting for the migration Job: ${motivo:-no revision yet}" >&2
                sleep 2
              done
          env:
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-postgres
                  key: POSTGRES_APP_PASSWORD
            - name: DATABASE_URL
              value: postgresql://os_app:$(POSTGRES_APP_PASSWORD)@os-postgres.pytstop-os.svc.cluster.local:5432/os
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: consumidor
          image: pytstop-os-service
          imagePullPolicy: IfNotPresent
          command: [python, -m, src.consumidor]
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: os-service
          env:
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-postgres
                  key: POSTGRES_APP_PASSWORD
            - name: DATABASE_URL
              value: postgresql://os_app:$(POSTGRES_APP_PASSWORD)@os-postgres.pytstop-os.svc.cluster.local:5432/os
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: RABBITMQ_URL
          # As sondas do relay (relay.yaml), com os arquivos do consumidor.
          startupProbe:
            exec:
              command:
                - python
                - -c
                - import os,sys,time;sys.exit(time.time()-os.path.getmtime('/tmp/consumidor-heartbeat')>90)
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import os,sys,time;sys.exit(time.time()-os.path.getmtime('/tmp/consumidor-heartbeat')>90)
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: [test, -f, /tmp/consumidor-pronto]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
