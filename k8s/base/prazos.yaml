# Processo prazos (python -m src.prazos), na mesma imagem da API: a cada
# PRAZOS_INTERVALO_SEGUNDOS reenvia o comando da saga que ficou sem resposta
# e, esgotados os reenvios, inicia a compensacao ou para a saga em
# falha_na_compensacao (docs/saga.md, "Prazos, falha na compensacao e retomada"). Sem
# HTTP de negocio: a saude e por arquivo em /tmp, como o relay (relay.yaml). O
# pronto so existe com o RabbitMQ de pe: sem consumidor em os.eventos ou sem
# broker o ciclo nao reenvia nem esgota prazo, so loga. Mesmos Secrets do relay
# e do consumidor, sem a ENCRYPTION_KEY: ele nao toca o documento do cliente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service-prazos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: os-service-prazos
  template:
    metadata:
      labels:
        app: os-service-prazos
        processo: prazos
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      # Cobre a saga em curso: o SIGTERM conclui a transacao dela antes de fechar.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # O mesmo da API (api.yaml): espera a migracao desta versao.
        - name: aguarda-migracao
          image: pytstop-os-service
          imagePullPolicy: IfNotPresent
          command: [python, -m, src.banco, aguardar]
          env:
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-postgres
                  key: POSTGRES_APP_PASSWORD
            - name: DATABASE_URL
              value: postgresql://os_app:$(POSTGRES_APP_PASSWORD)@os-postgres.pytstop-os.svc.cluster.local:5432/os
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: prazos
          image: pytstop-os-service
          imagePullPolicy: IfNotPresent
          command: [python, -m, src.prazos]
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: os-service
          env:
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-postgres
                  key: POSTGRES_APP_PASSWORD
            - name: DATABASE_URL
              value: postgresql://os_app:$(POSTGRES_APP_PASSWORD)@os-postgres.pytstop-os.svc.cluster.local:5432/os
            # O platform grava a URL do usuario os no Secret rabbitmq.
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: RABBITMQ_URL
          # As sondas do relay (relay.yaml), com os arquivos do prazos. A de vida
          # tolera 120 s sem heartbeat: o laco o toca a cada saga tratada e a
          # cada 5 s de espera, e um ciclo com o banco lento pode passar de 90 s;
          # a de startup e a mesma, com 1 min para o boot.
          startupProbe:
            exec:
              command:
                - python
                - -c
                - import os,sys,time;sys.exit(time.time()-os.path.getmtime('/tmp/prazos-heartbeat')>120)
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import os,sys,time;sys.exit(time.time()-os.path.getmtime('/tmp/prazos-heartbeat')>120)
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Broker fora tira o prazos de pronto sem reinicia-lo.
          readinessProbe:
            exec:
              command: [test, -f, /tmp/prazos-pronto]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
