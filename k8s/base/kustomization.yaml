# OS Service no namespace pytstop-os (docs/como-rodar.md, "Implantacao"). Nao aplique este
# diretorio direto: os overlays (kind, kind-ci e k3s) trazem o que muda por
# ambiente, e o implantar-servicos.sh do platform aplica um deles de uma vez e
# espera o banco, o Job de migracao e os Deployments, nessa ordem (os pods dos
# processos sobem junto e esperam a migracao no aguarda-migracao). Nenhum
# Secret aqui: os do servico nascem no make deploy do platform e entram por
# secretKeyRef (ADR-042).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pytstop-os

# Todo objeto, e os pods pelos templates, leva o part-of do servico; os
# seletores ficam so com o app. O rotulo vai tambem ao volumeClaimTemplates do
# StatefulSet do banco, que e imutavel: muda-lo exige recriar o StatefulSet.
labels:
  - pairs:
      app.kubernetes.io/part-of: os-service
    includeTemplates: true

resources:
  - namespace.yaml
  - banco.yaml
  - job.yaml
  - api.yaml
  - relay.yaml
  - consumidor.yaml
  - prazos.yaml
  - notificador.yaml
  - servico.yaml
  - hpa.yaml
  - networkpolicy.yaml
  - borda.yaml

configMapGenerator:
  # Ambiente da API, do relay, do consumidor, do prazos, do notificador e do Job
  # (envFrom); os overlays acrescentam o TRUSTED_PROXIES, o CIDR de pods do
  # cluster.
  - name: os-service
    literals:
      # Guardas de boot ligadas tambem no kind: os segredos sao gerados.
      - ENVIRONMENT=production
      # Prefixo na borda: o entrypoint o passa ao uvicorn (--root-path).
      - ROOT_PATH=/os
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=os-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger.pytstop-plataforma.svc.cluster.local:4317
      # Com o Jaeger fora do ar e a fila cheia, o SDK espera o exportador em cada
      # lote de 512 spans (a fila guarda ate 2.048). Com o prazo padrao do OTLP
      # (10 s) a API levou 30,5 s para sair, mais que os 30 s do grace period do
      # pod; com OTEL_EXPORTER_OTLP_TIMEOUT=2, 8,1 s (medido no container). O
      # OTEL_BSP_EXPORT_TIMEOUT fica fixado junto, mas o SDK 1.45 ainda nao o usa
      # (8,0 s sem ele).
      - OTEL_BSP_EXPORT_TIMEOUT=2000
      - OTEL_EXPORTER_OTLP_TIMEOUT=2
      # /metrics do relay, do consumidor, do prazos e do notificador, a porta
      # `metrics` dos Deployments.
      - METRICS_PORT=9100
      # Migracao e semente sao do Job, que os pods esperam.
      - RUN_MIGRATIONS_ON_STARTUP=false
      - RUN_SEED_ON_STARTUP=false
      - ADMIN_EMAIL=admin@pytstop.dev
      - CORS_ORIGINS=
      - RATE_LIMIT=60/minute
      - JWT_EXPIRATION_MINUTES=15
      - JWT_REFRESH_EXPIRATION_MINUTES=10080
      - OUTBOX_POLL_SEGUNDOS=5
      - OUTBOX_LOTE=10
      - OUTBOX_LEASE_SEGUNDOS=60
      # Prazos da saga (RFC-004 secoes 4.6 e 10.3). O prazo de resposta vale na
      # API e no consumidor, que o gravam no envio de cada comando, e no prazos,
      # que o compara com o instante em que o relay entregou o comando.
      - SAGA_PRAZO_RESPOSTA_SEGUNDOS=120
      - SAGA_MAX_REENVIOS=5
      - PRAZOS_INTERVALO_SEGUNDOS=30
      # SMTP do notificador: o Mailpit da plataforma, sem credencial (a demonstracao).
      # Trocar o servidor exige ajustar a politica `notificador-saida`
      # (networkpolicy.yaml): ela so deixa o notificador alcancar o Mailpit da
      # plataforma na 1025, e o destino novo expiraria sem aviso.
      - SMTP_HOST=mailpit.pytstop-plataforma.svc.cluster.local
      - SMTP_PORT=1025
      - SMTP_FROM=oficina@pytstop.local
      # Por replica da API; com 3 no HPA do k3s mais relay, consumidor, prazos e
      # notificador (2 + 2 cada, e o LISTEN do relay e do notificador), Job e
      # exporter, ficam abaixo do max_connections 100 do PostgreSQL 16 (63 sem eles).
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=10
  # Papeis do PostgreSQL, que a imagem cria no primeiro init do volume.
  - name: os-postgres-init
    files:
      - papeis.sql
