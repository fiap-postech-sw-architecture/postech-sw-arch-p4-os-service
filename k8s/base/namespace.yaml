# O make deploy do platform cria o namespace vazio, com a Role do Kong, antes
# deste apply; o servico o completa com o Pod Security restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: pytstop-os
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
