# k3s na VM da Azure (ADR-042). A imagem entra por digest, num overlay gerado
# a partir deste na implantacao, como o do kind-ci; sozinho, ele fica com a
# imagem sem tag. Aqui, o CIDR de pods do k3s, ate 3 replicas da API e mais
# disco para o banco (a StorageClass padrao do k3s e a local-path).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: os-service
    behavior: merge
    literals:
      - TRUSTED_PROXIES=10.42.0.0/16

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: os-service-api
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: StatefulSet
      name: os-postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
