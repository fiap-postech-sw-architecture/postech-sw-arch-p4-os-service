  messageTraits:
    envelope:
      contentType: application/json
      correlationId:
        description: "Id da ordem de serviço, que também identifica a instância da saga; em mensagem fora da saga, o id do agregado tratado (AnonimizarVeiculo: veiculo_id)."
        location: $message.payload#/correlation_id
      headers:
        type: object
        properties:
          traceparent:
            type: string
            description: "Contexto W3C Trace Context do span que publicou; o consumidor abre o span dele como filho."
          tracestate:
            type: string
            description: "Estado W3C Trace Context que acompanha o traceparent."
          x-tentativa:
            type: integer
            minimum: 1
            maximum: 5
            description: "Número da republicação na fila .retry (1 a 5); ausente na primeira entrega. A cópia leva o user_id do consumidor que a republicou."
