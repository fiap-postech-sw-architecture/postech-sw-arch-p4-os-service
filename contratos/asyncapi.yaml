                  $ref: ./schemas/DiagnosticoConcluido.schema.json
      bindings:
        amqp:
          messageType: DiagnosticoConcluido
          bindingVersion: 0.3.0
    DescartarDiagnostico:
      name: DescartarDiagnostico
      title: "Descartar diagnóstico"
      summary: "Compensação do passo T2: a Execução descarta o diagnóstico da OS cancelada."
