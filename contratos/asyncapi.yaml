asyncapi: 3.0.0
info:
  title: PytStop - mensageria da saga de atendimento
  version: 1.0.0
  description: |
    Comandos e eventos que os três serviços da fase 4 trocam pelo RabbitMQ.
    O OS Service orquestra a saga: publica comandos no exchange
    pytstop.comandos e consome os eventos que Billing e Execução publicam no
    exchange pytstop.eventos. Os participantes só consomem comandos.

    Todo corpo é um envelope (schemas/envelope.schema.json) cujo campo dados
    segue schemas/<tipo>.schema.json. Exemplos completos em exemplos/.
    Routing key: comando.<servico de destino>.<acao> ou
    evento.<servico de origem>.<fato>, com o nome da mensagem em snake_case.
    Retry: o consumidor republica a cópia no exchange pytstop.retry (topic, com
    permissão de tópico só para a própria fila) com a routing key igual ao nome da
    fila; a <fila>.retry devolve a mensagem para a fila
    quando o TTL da mensagem vence. Falha definitiva vai para <fila>.dlq pelo
    pytstop.dlx. Topologia completa em k8s/base/rabbitmq/definitions.json.

    Origem: o produtor preenche a propriedade AMQP user_id com o próprio usuário
    (o userId de cada operação de envio), e o broker recusa valor diferente do
    usuário da conexão. O consumidor aceita user_id igual ao produtor do tipo;
    na cópia de retry (header x-tentativa de 1 a 5), aceita o próprio usuário,
    porque quem republica é ele. Qualquer outro valor é erro permanente (DLQ).
defaultContentType: application/json
servers:
  kubernetes:
    host: rabbitmq.pytstop-plataforma.svc.cluster.local:5672
    protocol: amqp
    protocolVersion: 0-9-1
    description: "RabbitMQ da plataforma no kind ou no k3s (namespace pytstop-plataforma)."
  compose:
    host: localhost:5672
    protocol: amqp
    protocolVersion: 0-9-1
    description: "RabbitMQ do docker compose da plataforma."
channels:
  comando.execucao.solicitar_diagnostico:
    address: comando.execucao.solicitar_diagnostico
    title: "SolicitarDiagnostico"
    description: "Routing key de SolicitarDiagnostico no exchange pytstop.comandos."
    messages:
      SolicitarDiagnostico:
        $ref: '#/components/messages/SolicitarDiagnostico'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: pytstop.comandos
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
