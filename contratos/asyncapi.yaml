components:
  messages:
    SolicitarDiagnostico:
      name: SolicitarDiagnostico
      title: "Solicitar diagnóstico"
      summary: "Abre o passo T2 da saga: coloca o veículo na fila de diagnóstico da Execução."
      traits:
        - $ref: '#/components/messageTraits/envelope'
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          allOf:
            - $ref: ./schemas/envelope.schema.json
            - type: object
              properties:
                tipo:
                  const: SolicitarDiagnostico
                versao:
                  const: 1
                origem:
                  const: os-service
                dados:
                  $ref: ./schemas/SolicitarDiagnostico.schema.json
      bindings:
        amqp:
          messageType: SolicitarDiagnostico
          bindingVersion: 0.3.0
    DiagnosticoIniciado:
      name: DiagnosticoIniciado
      title: "Diagnóstico iniciado"
      summary: "Um mecânico pegou a OS na fila de diagnóstico; a OS passa a EM_DIAGNOSTICO."
      traits:
        - $ref: '#/components/messageTraits/envelope'
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          allOf:
            - $ref: ./schemas/envelope.schema.json
            - type: object
              properties:
                tipo:
                  const: DiagnosticoIniciado
                versao:
                  const: 1
                origem:
                  const: execution-service
                dados:
                  $ref: ./schemas/DiagnosticoIniciado.schema.json
      bindings:
        amqp:
          messageType: DiagnosticoIniciado
          bindingVersion: 0.3.0
    DiagnosticoConcluido:
      name: DiagnosticoConcluido
      title: "Diagnóstico concluído"
      summary: "Diagnóstico registrado com os serviços e peças necessários; o OS pede o orçamento ao Billing."
      traits:
        - $ref: '#/components/messageTraits/envelope'
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          allOf:
            - $ref: ./schemas/envelope.schema.json
