# Configuracao do RabbitMQ da plataforma, montada como
# /etc/rabbitmq/conf.d/20-pytstop.conf. O 10-defaults.conf da imagem continua
# valendo (log no console).

# Definitions importadas no boot a partir de um diretorio: definitions.json
# (topologia, ConfigMap) e admin.json (usuario admin, Secret no Kubernetes e
# arquivo proprio no compose). Com definitions no boot o RabbitMQ nao cria o
# usuario de RABBITMQ_DEFAULT_USER, por isso o admin vem no admin.json; os
# usuarios dos servicos vem do criar-usuarios.sh. A importacao e aditiva e
# idempotente: tirar uma fila do arquivo nao a apaga do broker.
#
# Argumento de fila (x-*) e imutavel e a importacao ignora a mudanca numa
# fila que ja existe; por isso dead-letter, overflow, tamanho maximo e o TTL da
# DLQ ficam nas policies do definitions.json, que a importacao sobrescreve a
# cada boot. Continuam argumento so o x-queue-type e o x-message-ttl das filas
# de retry: o atraso esta no nome da fila (<fila>.retry.1s a .300s), entao
# mudar um atraso e criar outra fila, nunca mudar o argumento desta.
#
# Sem definitions.skip_if_unchanged de proposito: o RabbitMQ grava o hash do
# conteudo mesmo quando a importacao falha, e o boot seguinte pula a
# importacao e sobe vazio (aconteceu no kind). Importar 21 filas a cada boot
# custa milissegundos.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions

# O RabbitMQ calcula o limite de memoria sobre a RAM do host, nao sobre o
# limite do cgroup: com 1Gi de limite no container ele so bloquearia os
# publishers depois do OOMKill. Valor absoluto, metade do limite do
# StatefulSet (rabbitmq.yaml); mude os dois juntos.
vm_memory_high_watermark.absolute = 512MiB

# Teto de 1 MiB por mensagem (o padrao e 16 MiB): um envelope da saga tem
# poucos KB, e mensagem maior so pode ser erro ou abuso.
max_message_size = 1048576
