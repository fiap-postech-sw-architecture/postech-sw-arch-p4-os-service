# Stack local do OS Service: API, relay da outbox, consumidor de `os.eventos`,
# processo dos prazos da saga e notificador dos e-mails (a mesma imagem, com
# comandos diferentes), PostgreSQL 16 proprio (banco `os`), um RabbitMQ 4 com a
# topologia do platform (contratos/rabbitmq/) e o Mailpit, o SMTP de demonstracao
# com caixa de entrada.
# Uso: `make compose-up` (build + migracoes + admin seed) e `make compose-down`.
# Todos os valores abaixo sao de DEMONSTRACAO para dev local; em qualquer
# ambiente exposto entram por Secret e o boot com ENVIRONMENT=production
# recusa estes literais (validar_segredos_no_startup, para a chave RSA do JWT
# validar_chave_jwt_no_startup e, nos processos com broker, a senha dele).
# Credenciais do Postgres de demo num lugar so: o banco as usa para se criar e
# a API (e o Alembic e o seed) monta a URL com elas (ENVIRONMENT=development).
x-banco-demo: &banco-demo
  POSTGRES_DB: os
  POSTGRES_USER: pytstop
  POSTGRES_PASSWORD: pytstop  # gitleaks:allow (senha do banco de demo)

# Prazos da saga: o prazo tecnico de resposta (segundos) vale igual na API (a
# primeira compensacao do cancelamento e a retomada), no consumidor (os comandos
# seguintes) e no prazos (que o compara com a entrega do comando); um ponto so,
# para ninguem gravar prazos diferentes para a mesma saga. Os reenvios e o
# intervalo dos ciclos so o prazos le. O original e os cinco reenvios (6 x 120 s)
# ficam acima dos 381 s do retry do consumidor.
x-saga: &saga
  SAGA_PRAZO_RESPOSTA_SEGUNDOS: ${SAGA_PRAZO_RESPOSTA_SEGUNDOS:-120}
  SAGA_MAX_REENVIOS: ${SAGA_MAX_REENVIOS:-5}
  PRAZOS_INTERVALO_SEGUNDOS: ${PRAZOS_INTERVALO_SEGUNDOS:-30}

# Exportacao dos spans (a API, o relay, o consumidor e o prazos). Com o Jaeger
# fora do ar o SDK espera o exportador ate estes prazos (os padroes sao 30 s e
# 10 s): sem eles a API levava os 30 s do grace period do pod para sair. Aqui a
# exportacao fica desligada; o kind a liga.
x-otel: &otel
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_BSP_EXPORT_TIMEOUT: "2000"
  OTEL_EXPORTER_OTLP_TIMEOUT: "2"

# Relay, consumidor e prazos: banco (montado das POSTGRES_* em development) e o usuario
# `os` do RabbitMQ, com a mesma senha de demonstracao do platform.
x-mensageria: &mensageria
  <<: [*banco-demo, *saga, *otel]
  POSTGRES_HOST: postgres
  ENVIRONMENT: development
  RABBITMQ_URL: amqp://os:pytstop-os-demo-2026@rabbitmq:5672/%2F  # gitleaks:allow (senha de demo)

# Notificador: so o banco e o SMTP. Sem RABBITMQ_URL (nao fala com o broker) e
# sem ENCRYPTION_KEY (le o contato do cliente em claro, sem decifrar o documento).
x-notificador: &notificador
  <<: *banco-demo
  POSTGRES_HOST: postgres
  ENVIRONMENT: development
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_FROM: ${SMTP_FROM:-oficina@pytstop.local}

# Relay, consumidor, prazos, notificador e Mailpit: sistema de arquivos so leitura
# (o /tmp dos arquivos de saude, e do banco do Mailpit, e um tmpfs), sem
# capabilities nem escalada de privilegio e com teto de memoria, CPU e processos.
# Cada processo da OS usa ate 4 conexoes com o banco (pool de 2 + 2), e o relay e o
# notificador mais 1, a do LISTEN.
x-processo-endurecido: &processo-endurecido
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  mem_limit: 256m
  cpus: 0.5
  pids_limit: 128

services:
  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        GIT_DATE: ${GIT_DATE:-unknown}
    image: ${APP_IMAGE:-pytstop-os-service:dev}
    restart: unless-stopped
    # So no loopback: o admin e as senhas de demo sao publicos no repo.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*banco-demo, *saga, *otel]
      POSTGRES_HOST: postgres
      ENVIRONMENT: development
      # Chave RSA de assinatura do JWT, so de desenvolvimento (escapes \n do YAML).
      JWT_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQCrnHu8kBQQGe7e\naDIDjS058VmeT2PJs2e3nXC+YCS0FQJ6xoYwOlJhWu/6xiK/ETR/hkf/wWDMlSqY\n8Gd36n4e9EL2sW1oQQiZXIxCbaZidz/xlJqk10ZZaFSc1ZJYOfj0gp3+maoNvwMU\nEZmlFBgNQtCvYodHDDfaf/Dm/GDfsr/cIsW6cpB9jFZG2D/5lB1Xmw0WXTiDwx+Q\nLE1xH1Sm8I7f2nQWgzTk/iJUXvcOTDG7c0UCHI87NUFW/5KAbDddoQ0agnaN/G/J\n7VxGBeihPgTxVXNIV6P09tUv9WQPGVIBY3+MAiUehKgpmyGEh8GzYO8uwczFEgRy\nHLizs0LRAgMBAAECggEABDK7jzEaIIu13YCAirgzLUnzdo08JHTMWoBSQAIDm9kw\nupatNTRUDBgoq0KaGoD9/wmmrMHLD64tgNjOuy8EH1c75SORiN2ga3oJX12l1p5S\ntOL9Bn/Ss4C7IywRXLGsXrTsTwxszdHIrj7A+robXYWvK782Dn2kxyZemxP8/bPs\nMmssmOj5IFohPQMs6Xm4pf8c/Lg7GTPRgq0TmiAOOE81nhP/q4vpMX9OLG/4O7I/\nplFTJMoWZEey32B/yCHXtOlVkJ4fQXwCIlfVla2oxLwTNimDQ2C7R/CX2E6/4nAL\nZyOofltYhqBXTeZH7u8uTBsxdtx6KpCEAwpTEa6OkQKBgQDm+Zi/0HcOEsKOso+M\nArgUau3OO0cJ+Vr1coghhManQq+Gg3DCArfe7zEAcOxSlakaisPFmrLxtNXTbndm\nZQePRMRXt0qTFslNLN88ens6aX2MKkBhyNLPFLv8P4IpkgW8Sm/v1SDnz+wyFCqX\nv0iTJaBCmhyM8NkOpkyLqFF/GQKBgQC+NFqEXRjsgnWJSHOq9Vx5YZjt7Ut2cf1j\nKSn5rEqSG8/+dIFeKRkZdS7JY682Tvbx5TP0bZAl6Lfx8rEaj8biBND55WdpiUff\nxeWyp52cT6X5ZgDr1Qapk5DTxAFZWx3oy+Yq1j3o9nnQiqC/Ojsc8Y0q4BoB/Okm\naI+cDtWweQKBgCn+//MAaGU6q/1eIhOG+wlbV9nDlWsO16cBKBdQGP6YdWmzxHDC\nJcR3ISW/YnixlYmp6WaodhjUlHxY/YS0oec+zaRVQ03zOq65le1dJ8K7I4S0ufgN\nl6bnUjbPJU+BqWFO94NX8R+1AnEokYX91ahLkxQJCV/m+tBbFFfgRtEhAoGBAIzW\nWTvvb3gY9Y0Mn9Ez0yBxuvpaHel7aENXhKRCBgmAHJfujqg5SEOIeHdYn7FX8RSW\nQc04n2bilenKaYcgdQSAynhvfA4yP40bjQSnhlXqyBwOgpodZ8yC3tdfKByREmmB\nKVIIx1jLwNFBBNvz8zdwSLY5sChOrBjrjYLhnSsJAoGAbrYrm/sHss9D78DUMcQs\nQLc5CEupusuQm9TWanFkmH9IRaG3GCmTJ1pI593t61///DcnUQtM3EtB12s5fQGJ\n1IT/hCQSJQLK/raOG/9NGg/daWkb1DnybAkdMtjP3KySdWGVXEKx9k9F5udb/3LW\nSmSFJR4e5p1A+K3QghW+aL0=\n-----END PRIVATE KEY-----\n"  # gitleaks:allow (chave RSA de demo)
      ENCRYPTION_KEY: Chqh4o4QURACWBUSdtXjAxhOQt6HhxAfEg9rtvsABKU=  # gitleaks:allow (chave Fernet de demo)
      RUN_MIGRATIONS_ON_STARTUP: "true"
      RUN_SEED_ON_STARTUP: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pytstop.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-demo-os-2026}  # gitleaks:allow (senha de demo)
    # Readiness (banco acessivel): o `up --wait` so libera com a API pronta.
    # O HEALTHCHECK da imagem segue na liveness /api/v1/saude.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/saude/pronto', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # Relay da outbox (python -m src.relay) e consumidor de os.eventos (python -m
  # src.consumidor): a imagem da API, sem HTTP de negocio. Sobem depois da API
  # pronta (migracoes aplicadas) e dos usuarios do RabbitMQ criados. Saudavel =
  # conectado ao broker (arquivo de pronto) e laco vivo: heartbeat do processo
  # com ate 90 s, porque com o broker mudo um publish fica ate cerca de 70 s
  # preso antes de o heartbeat AMQP derrubar a conexao.
  relay:
    image: ${APP_IMAGE:-pytstop-os-service:dev}
    # Imagem construida pelo servico api; nunca baixada de registry.
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "src.relay"]
    environment: *mensageria
    <<: *processo-endurecido
    depends_on:
      api:
        condition: service_healthy
      rabbitmq-usuarios:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if os.path.exists('/tmp/relay-pronto') and time.time() - os.path.getmtime('/tmp/relay-heartbeat') < 90 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  consumidor:
    image: ${APP_IMAGE:-pytstop-os-service:dev}
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "src.consumidor"]
    environment: *mensageria
    <<: *processo-endurecido
    depends_on:
      api:
        condition: service_healthy
      rabbitmq-usuarios:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if os.path.exists('/tmp/consumidor-pronto') and time.time() - os.path.getmtime('/tmp/consumidor-heartbeat') < 90 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Prazos da saga (python -m src.prazos): reenvia o comando sem resposta e,
  # esgotados os reenvios, compensa ou para a saga em falha_na_compensacao
  # (README, "Prazos, falha na compensacao e retomada"). Saudavel = conectado ao
  # RabbitMQ (arquivo de pronto) e laco vivo; a liveness tolera 120 s sem
  # heartbeat, como no Kubernetes.
  prazos:
    image: ${APP_IMAGE:-pytstop-os-service:dev}
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "src.prazos"]
    environment: *mensageria
    <<: *processo-endurecido
    depends_on:
      api:
        condition: service_healthy
      rabbitmq-usuarios:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if os.path.exists('/tmp/prazos-pronto') and time.time() - os.path.getmtime('/tmp/prazos-heartbeat') < 120 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Notificador dos e-mails ao cliente (python -m src.notificador): le a tabela
  # `notificacoes` e envia por SMTP ao Mailpit. Saudavel = banco alcancado (arquivo
  # de pronto) e laco vivo (heartbeat com ate 90 s). SMTP fora nao o tira de
  # pronto: so atrasa e-mail, e a saga nao passa por ele.
  notificador:
    image: ${APP_IMAGE:-pytstop-os-service:dev}
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "src.notificador"]
    environment: *notificador
    <<: *processo-endurecido
    depends_on:
      api:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if os.path.exists('/tmp/notificador-pronto') and time.time() - os.path.getmtime('/tmp/notificador-heartbeat') < 90 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Mailpit: o SMTP de demonstracao e a caixa de entrada web, a mesma imagem do
  # platform. Portas so no loopback e fora das do compose do platform
  # (1025/8025), para os dois conviverem. A caixa guarda os links de decisao e de
  # pagamento dos e-mails e a UI nao tem autenticacao: endurecido como os
  # processos e rodando como nobody, como no manifesto do platform (a imagem nao
  # define usuario).
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    user: "65534:65534"
    <<: *processo-endurecido
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # RabbitMQ com as mesmas definitions do platform (copiadas em
  # contratos/rabbitmq/, com o checksum conferido nos testes): exchanges,
  # filas, policies e o admin. Portas so no loopback, fora das do compose do
  # platform (5672/15672) para os dois conviverem.
  rabbitmq:
    image: rabbitmq:4.3.6-management
    # Nome do no Erlang fixo: com o hostname aleatorio do container, cada
    # recriacao viraria um no novo e o volume ficaria com um broker orfao.
    hostname: rabbitmq
    # Healthcheck rodando como root antes do boot criaria o .erlang.cookie com
    # dono root e o broker nao subiria.
    user: "999:999"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5674}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15674}:15672"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./contratos/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-pytstop.conf:ro
      - ./contratos/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./contratos/rabbitmq/definitions.json:/etc/rabbitmq/definitions/definitions.json:ro
      - ./contratos/rabbitmq/rabbitmq-admin.json:/etc/rabbitmq/definitions/admin.json:ro
    healthcheck:
      # pytstop.retry so existe se o definitions.json entrou no boot.
      test: ["CMD-SHELL", "rabbitmqctl -s list_exchanges name | grep -qx pytstop.retry && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 20s

  # Usuarios os, billing e execucao com as permissoes de permissoes.json, pelo
  # script do platform. Depois do script o container fica parado em vez de
  # sair: o `up --wait` trata container encerrado como falha. Saudavel =
  # usuarios criados.
  rabbitmq-usuarios:
    image: rabbitmq:4.3.6-management
    user: "999:999"
    # init: o sleep vira PID 1 e ignoraria o SIGTERM do `down`.
    init: true
    entrypoint: ["sh", "-c", "sh /scripts/criar-usuarios.sh && touch /tmp/usuarios-criados && exec sleep infinity"]
    volumes:
      - ./contratos/rabbitmq/criar-usuarios.sh:/scripts/criar-usuarios.sh:ro
      - ./contratos/rabbitmq/permissoes.json:/scripts/permissoes.json:ro
    environment:
      RABBITMQADMIN_TARGET_HOST: rabbitmq
      RABBITMQADMIN_TARGET_PORT: "15672"
      RABBITMQADMIN_NON_INTERACTIVE_MODE: "true"
      RABBITMQADMIN_USERNAME: admin
      RABBITMQADMIN_PASSWORD: pytstop-rabbitmq-admin-demo-2026  # gitleaks:allow (senha de demo)
      RABBITMQ_OS_PASSWORD: pytstop-os-demo-2026  # gitleaks:allow (senha de demo)
      RABBITMQ_BILLING_PASSWORD: pytstop-billing-demo-2026  # gitleaks:allow (senha de demo)
      RABBITMQ_EXECUCAO_PASSWORD: pytstop-execucao-demo-2026  # gitleaks:allow (senha de demo)
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/usuarios-criados"]
      interval: 2s
      timeout: 2s
      retries: 90
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16
    restart: unless-stopped
    # Sem porta publicada no host: a API e a interface; para inspecionar,
    # `docker compose exec postgres psql -U pytstop os`.
    environment: *banco-demo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pytstop -d os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  rabbitmq_data:
