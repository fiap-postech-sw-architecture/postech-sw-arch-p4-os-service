# Mutantes manuais dos modulos criticos (scripts/mutacao_manual.py, make mutacao).
#
# Cada [[mutante]] troca o trecho `de` (uma ocorrencia exata no arquivo) por
# `para` e roda so os testes do grupo `testes`; o teste esperado e o que deveria
# pegar o defeito. `equivalente` marca o mutante que nao muda o comportamento:
# se sobreviver, nao conta contra a suite.

[config]
# O que o script copia do repositorio para mutants/ (arquivos e pastas): tudo
# que os testes dos grupos abaixo importam ou leem. Os de integracao criam o
# schema pela migracao real (alembic.ini e migrations/), validam as mensagens
# pelos contratos (contratos/, que tambem leva a topologia do RabbitMQ de
# teste) e sobem o PostgreSQL e o RabbitMQ por testcontainers (precisam de
# Docker). Os do JWT importam scripts/validar_token.py e leem a chave de
# demonstracao do docker-compose.yml e do .env.example.
copiar = ["src", "tests", "contratos", "migrations", "alembic.ini", "scripts", "docker-compose.yml", ".env.example", "pyproject.toml", ".coveragerc"]

[testes]
# Os arquivos rodam na ordem da lista e o pytest para no primeiro teste que
# falha: o mais rapido vai primeiro.
status = ["tests/unitarios/ordem_servico/test_maquina_de_status.py", "tests/unitarios/ordem_servico/test_ordem_de_servico.py"]
classificacao = ["tests/unitarios/ordem_servico/test_classificacao.py", "tests/unitarios/ordem_servico/test_saga.py"]
transicoes = ["tests/unitarios/ordem_servico/test_transicoes.py", "tests/unitarios/ordem_servico/test_saga.py"]
prazos = ["tests/unitarios/ordem_servico/test_prazos_da_saga.py", "tests/unitarios/ordem_servico/test_saga.py", "tests/unitarios/ordem_servico/test_vencer_prazos.py"]
compensacao = ["tests/unitarios/ordem_servico/test_compensacao.py", "tests/unitarios/ordem_servico/test_orquestrador_compensacoes.py"]
orquestrador = ["tests/unitarios/ordem_servico/test_orquestrador.py", "tests/unitarios/ordem_servico/test_orquestrador_compensacoes.py"]
politica_do_consumidor = ["tests/unitarios/compartilhado/mensageria/test_politica_do_consumidor.py"]
consumidor = ["tests/unitarios/compartilhado/mensageria/test_politica_do_consumidor.py", "tests/integracao/mensageria/test_consumidor.py"]
politica_do_relay = ["tests/unitarios/compartilhado/mensageria/test_politica_do_relay.py"]
relay = ["tests/integracao/mensageria/test_marcacao_com_fencing.py", "tests/integracao/mensageria/test_replicas.py", "tests/integracao/mensageria/test_relay.py"]
jwt = ["tests/unitarios/autenticacao/test_jwt_service.py", "tests/unitarios/autenticacao/test_jwks.py"]
acesso = ["tests/unitarios/autenticacao/test_middleware.py", "tests/unitarios/autenticacao/test_dependencies_auth.py"]
cpf = ["tests/unitarios/compartilhado/test_cpf.py", "tests/unitarios/compartilhado/test_cnpj.py"]


